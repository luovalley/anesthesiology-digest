name: Deploy Hugo Site to Cloudflare Pages

on:
  push:
    branches:
      - main  # 每次你在网页端修改保存，都会触发自动构建

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 自动拉取主题（如 PaperMod 子模块）

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --gc --minify

      # 后续可直接将编译好的 public 文件夹推送到 Cloudflare 关联的部署源
